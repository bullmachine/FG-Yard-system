# Checks every push and pull request: the backend builds and its tests pass against a
# throwaway MariaDB (same major version as XAMPP on the server); the frontend
# type-checks and builds. Nothing here touches the live server or its database.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:ci-root@127.0.0.1:3306/yard_management_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: API tests (gate, parking, dispatch, PDI, access)
        run: npm run test:api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # The code base still has older lint findings (React hooks rules); shown as a
      # report until they are cleared, then remove continue-on-error.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
